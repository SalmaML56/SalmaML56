<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120" role="img" aria-label="Results from past work">
<style>text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.v{font-size:34px;font-weight:800;fill:#1f4d45;letter-spacing:-1px}.l{font-size:13px;fill:#4b5a54}
.t{opacity:0;animation:in .7s ease forwards}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.b{transform-box:fill-box;transform-origin:left;animation:g 1.2s cubic-bezier(.16,1,.3,1) both}@keyframes g{from{transform:scaleX(0)}}</style>
